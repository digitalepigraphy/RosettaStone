<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Res Gestae Squeeze Collection — Search</title>
<meta name="description" id="meta-description" content="Search and browse a digitized epigraphic squeeze collection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg: #ece4d1;
    --bg-alt: #e1d6bc;
    --surface: #faf7ee;
    --surface-raised: #ffffff;
    --ink: #2a2318;
    --ink-soft: #5c5240;
    --ink-faint: #83795f;
    --line: #cabd9a;
    --line-strong: #ab9c74;
    --accent: #5c6b3f;
    --accent-ink: #ffffff;
    --accent-2: #9a4a26;
    --focus: #1c56b8;
    --shadow-groove: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.06);
    --radius-s: 4px;
    --radius-m: 10px;
    --font-display: "Noto Serif Display", "Noto Serif", Georgia, serif;
    --font-serif: "Noto Serif", Georgia, serif;
    --font-ui: "Inter", system-ui, -apple-system, sans-serif;
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #171310;
    --bg-alt: #1e1913;
    --surface: #221c15;
    --surface-raised: #292219;
    --ink: #ece3d1;
    --ink-soft: #c1b49a;
    --ink-faint: #8f8368;
    --line: #3c3324;
    --line-strong: #574a34;
    --accent: #a3b47f;
    --accent-ink: #1a1a12;
    --accent-2: #e0925c;
    --focus: #7fb0ff;
    --shadow-groove: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 0 rgba(0,0,0,.5);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #171310;
      --bg-alt: #1e1913;
      --surface: #221c15;
      --surface-raised: #292219;
      --ink: #ece3d1;
      --ink-soft: #c1b49a;
      --ink-faint: #8f8368;
      --line: #3c3324;
      --line-strong: #574a34;
      --accent: #a3b47f;
      --accent-ink: #1a1a12;
      --accent-2: #e0925c;
      --focus: #7fb0ff;
      --shadow-groove: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 0 rgba(0,0,0,.5);
    }
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .skip-link{
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--accent);
    color: var(--accent-ink);
    padding: .75rem 1.25rem;
    z-index: 100;
    border-radius: 0 0 var(--radius-s) 0;
  }
  .skip-link:focus{ left: 0; }

  :focus-visible{
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- theme toggle ---------- */
  .theme-toggle{
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    padding: .5rem .9rem;
    font-family: var(--font-ui);
    font-size: .85rem;
    cursor: pointer;
    box-shadow: var(--shadow-groove);
  }
  .theme-toggle svg{ width: 16px; height: 16px; display: block; }
  .theme-toggle .icon-dark{ display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-light{ display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-dark{ display: block; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-light{ display: none; }
    :root:not([data-theme="light"]) .theme-toggle .icon-dark{ display: block; }
  }

  /* ---------- hero ---------- */
  .hero{
    background: linear-gradient(180deg, var(--bg-alt), var(--bg));
    border-bottom: 1px solid var(--line);
    padding: clamp(3rem, 8vw, 5.5rem) 1.5rem 3rem;
    text-align: center;
  }
  .logo-link{
    display: inline-block;
    margin: 0 auto 1.25rem;
    border-radius: var(--radius-s);
  }
  .site-logo{
    width: 56px;
    height: 56px;
    display: block;
    border-radius: var(--radius-s);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    transition: transform .15s ease, filter .15s ease;
  }
  .logo-link:hover .site-logo{
    transform: translateY(-1px);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  .eyebrow-link{
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .15s ease, color .15s ease;
  }
  .eyebrow-link:hover, .eyebrow-link:focus-visible{
    color: var(--accent-2);
    border-color: currentColor;
  }
  .hero__rule{
    width: 72px;
    height: 2px;
    background: var(--accent-2);
    margin: 0 auto 1.5rem;
  }
  .hero__eyebrow{
    font-family: var(--font-ui);
    font-size: .8rem;
    color: var(--ink-faint);
    margin: 0 0 .6rem;
  }
  .hero h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.9rem, 4.4vw, 3.1rem);
    line-height: 1.15;
    margin: 0 0 .9rem;
    color: var(--ink);
  }
  .hero p.lede{
    font-family: var(--font-serif);
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 auto 2.4rem;
  }

  .search-wrap{
    max-width: 640px;
    margin: 0 auto;
  }
  .search-field{
    position: relative;
    display: flex;
    align-items: center;
    background: var(--surface-raised);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-groove);
    padding: 0 .5rem 0 1.1rem;
  }
  .search-field svg{
    width: 20px;
    height: 20px;
    flex: none;
    color: var(--ink-faint);
  }
  .search-field input{
    flex: 1;
    border: 0;
    background: transparent;
    padding: 1rem .8rem;
    font-family: var(--font-ui);
    font-size: 1.05rem;
    color: var(--ink);
    min-width: 0;
  }
  .search-field input::placeholder{ color: var(--ink-faint); }
  .search-field input:focus{ outline: none; }
  .search-field:focus-within{
    border-color: var(--accent);
    box-shadow: var(--shadow-groove), 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .clear-btn{
    flex: none;
    border: 0;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    padding: .5rem;
    border-radius: 50%;
    display: none;
    line-height: 0;
  }
  .clear-btn.is-visible{ display: inline-flex; }
  .clear-btn:hover{ color: var(--accent-2); }

  .filters{
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    justify-content: center;
    margin-top: 1rem;
  }
  .chip{
    font-family: var(--font-ui);
    font-size: .82rem;
    padding: .4rem .9rem;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip[aria-pressed="true"]{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* ---------- results ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }
  .results-meta{
    font-family: var(--font-ui);
    font-size: .88rem;
    color: var(--ink-faint);
    margin: 0 0 1.4rem;
    text-align: center;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1.4rem;
  }

  .card{
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    overflow: hidden;
    box-shadow: var(--shadow-groove);
    transition: border-color .15s ease;
  }
  .card.is-expanded{
    grid-column: 1 / -1;
    border-color: var(--accent);
  }

  .card__toggle{
    all: unset;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    width: 100%;
    cursor: pointer;
    text-align: left;
    transition: transform .15s ease;
  }
  .card__toggle:hover{ transform: translateY(-2px); }
  .card.is-expanded .card__toggle:hover{ transform: none; }
  .card__toggle:focus-visible{
    outline: 3px solid var(--focus);
    outline-offset: -3px;
  }
  @media (min-width: 640px){
    .card.is-expanded .card__toggle{
      flex-direction: row;
      align-items: stretch;
    }
    .card.is-expanded .card__media{
      flex: 0 0 300px;
      aspect-ratio: auto;
      border-bottom: 0;
      border-right: 1px solid var(--line);
    }
  }

  .card__media{
    aspect-ratio: 16 / 10;
    background:
      repeating-linear-gradient(135deg, color-mix(in srgb, var(--line) 40%, transparent) 0 2px, transparent 2px 10px),
      var(--bg-alt);
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .card__media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card.is-expanded .card__media img{ cursor: zoom-in; }
  .card__zoom-hint{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,17,12,0);
    opacity: 0;
    transition: opacity .15s ease, background-color .15s ease;
    color: #f1ead9;
    pointer-events: none;
  }
  .card__zoom-hint svg{ width: 26px; height: 26px; }
  .card.is-expanded .card__media:hover .card__zoom-hint{
    opacity: 1;
    background: rgba(20,17,12,.35);
  }
  .card__id{
    position: absolute;
    left: .6rem;
    bottom: .6rem;
    font-family: var(--font-ui);
    font-size: .72rem;
    letter-spacing: .02em;
    background: rgba(20,17,12,.72);
    color: #f1ead9;
    padding: .2rem .55rem;
    border-radius: var(--radius-s);
  }
  .card__body{
    padding: 1.1rem 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
    flex: 1;
    min-width: 0;
  }
  .card__title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.08rem;
    line-height: 1.3;
    margin: 0;
    color: var(--ink);
  }
  .card__meta{
    font-family: var(--font-ui);
    font-size: .8rem;
    color: var(--ink-faint);
    display: flex;
    flex-wrap: wrap;
    gap: .3rem .5rem;
    margin: 0;
  }
  .card__meta .lang{
    color: var(--accent);
    font-weight: 600;
  }
  .card__text{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .9rem;
    color: var(--ink-soft);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card__cta{
    margin-top: auto;
    padding-top: .5rem;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-family: var(--font-ui);
    font-size: .82rem;
    font-weight: 600;
    color: var(--accent-2);
  }
  .card__cta svg{
    width: 14px;
    height: 14px;
    transition: transform .2s ease;
    flex: none;
  }
  .card__toggle[aria-expanded="true"] .card__cta svg{ transform: rotate(180deg); }

  /* ---------- expanded detail panel ---------- */
  .card__panel{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
    border-top: 1px solid transparent;
  }
  .card.is-expanded .card__panel{
    grid-template-rows: 1fr;
    border-top-color: var(--line);
  }
  .card__panel-inner{
    overflow: hidden;
    min-height: 0;
  }
  .card__panel-content{
    padding: 1.4rem 1.4rem 1.6rem;
  }

  .card__panel-actions{
    display: flex;
    flex-wrap: wrap;
    gap: .7rem;
    margin: 0 0 1.4rem;
  }

  .viewer-cta, .github-cta{
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: .92rem;
    text-decoration: none;
    padding: .7rem 1.3rem;
    border-radius: 999px;
  }
  .viewer-cta svg, .github-cta svg{ width: 16px; height: 16px; flex: none; }

  .viewer-cta{
    background: var(--accent);
    color: var(--accent-ink);
  }
  .viewer-cta:hover, .viewer-cta:focus-visible{
    background: var(--accent-2);
  }

  .github-cta{
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
  }
  .github-cta:hover, .github-cta:focus-visible{
    color: var(--ink);
    border-color: var(--accent-2);
  }

  .info-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.1rem;
  }
  @media (min-width: 560px){
    .info-grid{
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .info-box--wide{
    grid-column: 1 / -1;
  }
  .info-box{
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    padding: 1rem 1.1rem 1.15rem;
    box-shadow: var(--shadow-groove);
    min-width: 0;
  }
  .info-box h4{
    font-family: var(--font-ui);
    font-size: .74rem;
    letter-spacing: .03em;
    color: var(--ink-faint);
    margin: 0 0 .6rem;
  }
  .info-box .info-subtitle{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
    margin: 0 0 .7rem;
    line-height: 1.3;
  }
  .info-box dl{
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: .4rem .7rem;
    align-items: start;
  }
  .info-box dt{
    font-family: var(--font-ui);
    font-size: .72rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .info-box dd{
    margin: 0;
    font-family: var(--font-ui);
    font-size: .82rem;
    color: var(--ink-soft);
    word-break: break-word;
  }
  .info-box dd ul{
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: .25rem;
  }
  .info-box dd a{
    color: var(--accent-2);
    text-decoration: underline;
    word-break: break-all;
  }
  .transcription{
    margin: .9rem 0 0;
    padding-top: .9rem;
    border-top: 1px solid var(--line);
    font-family: var(--font-serif);
    font-style: italic;
    line-height: 1.85;
    font-size: .92rem;
    color: var(--ink);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  .empty, .error{
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--ink-soft);
    font-family: var(--font-serif);
    font-size: 1.05rem;
  }
  .error{ color: var(--accent-2); }
  .error code{
    display: inline-block;
    margin-top: .6rem;
    font-family: monospace;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: .15rem .5rem;
    border-radius: var(--radius-s);
    font-size: .85rem;
  }

  .footer-logo{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    margin-bottom: .6rem;
    text-decoration: none;
    color: var(--ink-soft);
  }
  .footer-logo:hover, .footer-logo:focus-visible{
    color: var(--accent-2);
  }
  .footer-logo img{
    width: 22px;
    height: 22px;
    border-radius: 4px;
  }
  footer{
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    font-family: var(--font-ui);
    font-size: .8rem;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
  }
  footer a{ color: var(--ink-soft); text-decoration: underline; }

  body.lightbox-open{ overflow: hidden; }

  /* ---------- image lightbox ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(10,8,5,.8);
  }
  .lightbox[hidden]{
    display: none;
  }
  .lightbox__panel{
    position: relative;
    max-width: min(92vw, 1100px);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lightbox__img{
    display: block;
    max-width: 100%;
    max-height: 78vh;
    border-radius: var(--radius-s);
    background: var(--bg-alt);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .lightbox__caption{
    margin: .9rem 0 0;
    font-family: var(--font-ui);
    font-size: .85rem;
    color: #f1ead9;
    text-align: center;
  }
  .lightbox__close{
    all: unset;
    box-sizing: border-box;
    position: absolute;
    top: -14px;
    right: -14px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-raised);
    color: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .lightbox__close svg{ width: 18px; height: 18px; }
  .lightbox__close:hover, .lightbox__close:focus-visible{
    color: var(--accent-2);
  }
  @media (max-width: 480px){
    .lightbox__close{ top: .5rem; right: .5rem; }
  }

  @media (max-width: 480px){
    .theme-toggle span{ display: none; }
    .theme-toggle{ padding: .55rem; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    .card, .card__toggle, .card__panel, .card__cta svg{ transition: none; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#search-input">Skip to search</a>

<button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
  <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
  <span id="theme-toggle-label">Dark mode</span>

  "use strict";

  var state = {
    data: null,
    baseUrl: "",
    folder: "",
    editorsDict: {},
    sourcesDict: {},
    records: [],       // [{id, record, searchText, language}]
    languages: [],
    activeLanguage: null,
    query: "",
    expandedId: null,
    cardRefs: {}        // id -> { article, toggleBtn, panel }
  };

  var els = {
    title: document.getElementById("collection-title"),
    lede: document.getElementById("collection-lede"),
    eyebrow: document.getElementById("site-eyebrow"),
    input: document.getElementById("search-input"),
    clearBtn: document.getElementById("clear-btn"),
    filters: document.getElementById("filters"),
    grid: document.getElementById("grid"),
    meta: document.getElementById("results-meta"),
    form: document.getElementById("search-form"),
    themeToggle: document.getElementById("theme-toggle"),
    themeLabel: document.getElementById("theme-toggle-label"),
    footerCredit: document.getElementById("footer-credit"),
    metaDescription: document.getElementById("meta-description"),
    lightbox: document.getElementById("lightbox"),
    lightboxImg: document.getElementById("lightbox-img"),
    lightboxCaption: document.getElementById("lightbox-caption"),
    lightboxClose: document.getElementById("lightbox-close")
  };

  /* ---------------- theme ---------------- */
  function getStoredTheme(){
    try { return localStorage.getItem("rg-theme"); } catch(e){ return null; }
  }
  function storeTheme(v){
    try { localStorage.setItem("rg-theme", v); } catch(e){ /* ignore */ }
  }
  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function applyTheme(theme){
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    var isDark = theme ? theme === "dark" : systemPrefersDark();
    els.themeToggle.setAttribute("aria-pressed", String(isDark));
    els.themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
  }
  (function initTheme(){
    var stored = getStoredTheme();
    applyTheme(stored);
  })();
  els.themeToggle.addEventListener("click", function(){
    var current = document.documentElement.getAttribute("data-theme");
    var isDark = current ? current === "dark" : systemPrefersDark();
    var next = isDark ? "light" : "dark";
    storeTheme(next);
    applyTheme(next);
  });

  /* ---------------- helpers ---------------- */
  function resolveEditors(idList, editorsDict){
    if (!Array.isArray(idList)) return [];
    return idList.map(function(entry){
      if (entry && entry.id && editorsDict && editorsDict[entry.id]) {
        return editorsDict[entry.id].Name || entry.id;
      }
      return entry && entry.id ? entry.id : null;
    }).filter(Boolean);
  }

  function guessFolderName(url){
    try {
      var path = new URL(url).pathname.split("/").filter(Boolean);
      return path[path.length - 1] || "";
    } catch(e){
      var trimmed = String(url || "").replace(/\/+$/, "");
      var parts = trimmed.split("/");
      return parts[parts.length - 1] || "";
    }
  }

  function prefersReducedMotion(){
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // Resolve a record/squeeze "Sources" array into displayable {text, url} entries,
  // looking up shared citations from the top-level Sources dictionary on the fly.
  function resolveSources(list){
    if (!Array.isArray(list)) return [];
    return list.map(function(entry){
      if (!entry) return null;
      if (entry.id && state.sourcesDict && state.sourcesDict[entry.id]) {
        var s = state.sourcesDict[entry.id];
        var bits = [s["Author(s)"], s.Title].filter(Boolean).join(", ");
        var tail = [s.Publication, s.Volume ? ("vol. " + s.Volume) : null, s.Number ? ("no. " + s.Number) : null]
          .filter(Boolean).join(", ");
        var year = s.Year ? " (" + s.Year + ")" : "";
        var pages = s.Pages ? ", pp. " + s.Pages : "";
        var text = [bits, tail].filter(Boolean).join(" — ") + year + pages;
        return { text: text || entry.id, url: null };
      }
      if (entry.url) return { text: entry.url, url: entry.url };
      if (entry.id) return { text: entry.id, url: null };
      return null;
    }).filter(Boolean);
  }

  // Build a <dl> from an ordered list of {label, value} rows. `value` may be a
  // plain string/number, or an array of {text, url} entries rendered as links.
  function buildDL(rows){
    var dl = document.createElement("dl");
    var any = false;
    rows.forEach(function(row){
      if (row == null) return;
      var value = row.value;
      var isEmptyArray = Array.isArray(value) && value.length === 0;
      if (value == null || value === "" || isEmptyArray) return;
      any = true;

      var dt = document.createElement("dt");
      dt.textContent = row.label;
      dl.appendChild(dt);

      var dd = document.createElement("dd");
      if (Array.isArray(value)) {
        var ul = document.createElement("ul");
        value.forEach(function(item){
          var li = document.createElement("li");
          if (item && typeof item === "object" && item.url) {
            var a = document.createElement("a");
            a.href = item.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.text;
            li.appendChild(a);
          } else {
            li.textContent = (item && item.text) || String(item);
          }
          ul.appendChild(li);
        });
        dd.appendChild(ul);
      } else {
        dd.textContent = String(value);
      }
      dl.appendChild(dd);
    });
    return any ? dl : null;
  }

  // Every remaining top-level field of an object, in JSON key order, skipping
  // any keys already surfaced elsewhere (Title, Text, Editors, Sources, nested objects).
  function genericRows(obj, skipKeys){
    var skip = skipKeys || [];
    return Object.keys(obj || {})
      .filter(function(key){ return skip.indexOf(key) === -1; })
      .filter(function(key){
        var v = obj[key];
        return typeof v === "string" || typeof v === "number";
      })
      .map(function(key){ return { label: key, value: obj[key] }; });
  }

  function buildInfoBox(heading, subtitle, rows, extraNode, wide){
    var box = document.createElement("section");
    box.className = "info-box" + (wide ? " info-box--wide" : "");
    box.setAttribute("aria-label", subtitle ? heading + ": " + subtitle : heading);

    var h4 = document.createElement("h4");
    h4.textContent = heading;
    box.appendChild(h4);

    if (subtitle) {
      var sub = document.createElement("p");
      sub.className = "info-subtitle";
      sub.textContent = subtitle;
      box.appendChild(sub);
    }

    var dl = buildDL(rows);
    if (dl) box.appendChild(dl);

    if (extraNode) box.appendChild(extraNode);

    return box;
  }

  function buildSearchIndex(json){
    var editorsDict = json.Editors || {};
    var records = [];
    var languageSet = {};

    Object.keys(json.Records || {}).forEach(function(id){
      var record = json.Records[id];
      var squeeze = record.Squeeze || {};
      var inscription = record.Inscription || {};
      var object = record.Object || {};

      var topEditors = resolveEditors(record.Editors, editorsDict);
      var squeezeEditors = resolveEditors(squeeze.Editors, editorsDict);
      var objectEditors = resolveEditors(object.Editors, editorsDict);

      // Pull every string/number field out of the record and its Squeeze,
      // Inscription, and Object sub-objects, so search matches any visible
      // text (not just a hand-picked list of "important" fields).
      var allFieldValues = []
        .concat(genericRows(record, ["Squeeze", "Inscription", "Object", "Editors", "Sources"]).map(function(r){ return r.value; }))
        .concat(genericRows(squeeze, ["Editors", "Sources"]).map(function(r){ return r.value; }))
        .concat(genericRows(inscription, ["Editors", "Sources"]).map(function(r){ return r.value; }))
        .concat(genericRows(object, ["Editors", "Sources"]).map(function(r){ return r.value; }));

      var parts = [id]
        .concat(allFieldValues)
        .concat([topEditors.join(" "), squeezeEditors.join(" "), objectEditors.join(" ")])
        .filter(Boolean).join(" ").toLowerCase();

      var lang = inscription.Language || "Unknown";
      languageSet[lang] = true;

      records.push({
        id: id,
        record: record,
        language: lang,
        searchText: parts
      });
    });

    records.sort(function(a, b){ return a.id.localeCompare(b.id); });

    return {
      records: records,
      languages: Object.keys(languageSet).sort()
    };
  }

  function matchesQuery(entry, query){
    if (state.activeLanguage && entry.language !== state.activeLanguage) return false;
    if (!query) return true;
    var terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    return terms.every(function(term){ return entry.searchText.indexOf(term) !== -1; });
  }

  function formatTranscription(text){
    return String(text).split(/\s*\/\s*/).map(function(line){ return line.trim(); }).filter(Boolean).join("\n");
  }

  function buildViewerLink(entry){
    var viewerUrl = "https://digitalepigraphy.github.io/viewer2.5/viewfull.html?heightmap=" +
      encodeURIComponent(state.folder) + "/" + encodeURIComponent(entry.id);
    var a = document.createElement("a");
    a.className = "viewer-cta";
    a.href = viewerUrl;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    var svg = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M14 3h7v7\"></path><path d=\"M10 14L21 3\"></path><path d=\"M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6\"></path></svg>";
    a.innerHTML = svg;
    var label = document.createElement("span");
    label.textContent = "Open in 3D viewer";
    a.appendChild(label);
    a.setAttribute("aria-label", "Open record " + entry.id + " in the 3D viewer (opens in a new tab)");
    return a;
  }

  function buildGithubLink(entry){
    var githubUrl = "https://github.com/digitalepigraphy/" +
      encodeURIComponent(state.folder) + "/tree/main/" + encodeURIComponent(entry.id);
    var a = document.createElement("a");
    a.className = "github-cta";
    a.href = githubUrl;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    var svg = "<svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 2C6.48 2 2 6.58 2 12.19c0 4.49 2.87 8.3 6.84 9.64.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.57 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.19C22 6.58 17.52 2 12 2Z\"></path></svg>";
    a.innerHTML = svg;
    var label = document.createElement("span");
    label.textContent = "Open in GitHub";
    a.appendChild(label);
    a.setAttribute("aria-label", "Open record " + entry.id + " on GitHub (opens in a new tab)");
    return a;
  }

  // Build the three-box detail panel: the record's own fields, then the Squeeze
  // (paper cast) fields led by its Title, then the Inscription fields led by its
  // Title, with the transcribed text formatted underneath. Every field is read
  // from the record object at render time, so unfamiliar/extra JSON keys still appear.
  function buildPanelContent(entry){
    var record = entry.record;
    var squeeze = record.Squeeze || {};
    var inscription = record.Inscription || {};
    var object = record.Object || {};
    var hasSqueeze = Object.keys(squeeze).length > 0;
    var hasInscription = Object.keys(inscription).length > 0;
    var hasObject = Object.keys(object).length > 0;

    var wrap = document.createElement("div");
    wrap.className = "card__panel-content";

    var actions = document.createElement("div");
    actions.className = "card__panel-actions";
    actions.appendChild(buildViewerLink(entry));
    actions.appendChild(buildGithubLink(entry));
    wrap.appendChild(actions);

    var infoGrid = document.createElement("div");
    infoGrid.className = "info-grid";

    var recordRows = genericRows(record, ["Squeeze", "Inscription", "Object", "Editors", "Sources"]);
    recordRows.push({ label: "Editors", value: resolveEditors(record.Editors, state.editorsDict) });
    recordRows.push({ label: "Sources", value: resolveSources(record.Sources) });
    infoGrid.appendChild(buildInfoBox("Imaging", entry.id, recordRows));

    // Squeeze, Object, and Inscription panels only appear when the record
    // actually has that data — a missing sub-object means no box, rather
    // than an empty heading with nothing underneath it.
    if (hasSqueeze) {
      var squeezeRows = genericRows(squeeze, ["Title", "Editors", "Sources"]);
      squeezeRows.push({ label: "Editors", value: resolveEditors(squeeze.Editors, state.editorsDict) });
      squeezeRows.push({ label: "Sources", value: resolveSources(squeeze.Sources) });
      infoGrid.appendChild(buildInfoBox("Squeeze", squeeze.Title || null, squeezeRows));
    }

    // The Object box sits in the same side-by-side slot as Squeeze; a record
    // never has both, so there's no placement conflict between them.
    if (hasObject) {
      var objectRows = genericRows(object, ["Title", "Editors", "Sources"]);
      objectRows.push({ label: "Editors", value: resolveEditors(object.Editors, state.editorsDict) });
      objectRows.push({ label: "Sources", value: resolveSources(object.Sources) });
      infoGrid.appendChild(buildInfoBox("Object", object.Title || null, objectRows));
    }

    if (hasInscription) {
      var inscriptionRows = genericRows(inscription, ["Title", "Text", "Editors", "Sources"]);
      if (Array.isArray(inscription.Editors)) {
        inscriptionRows.push({ label: "Editors", value: resolveEditors(inscription.Editors, state.editorsDict) });
      }
      if (Array.isArray(inscription.Sources)) {
        inscriptionRows.push({ label: "Sources", value: resolveSources(inscription.Sources) });
      }
      var transcriptionNode = null;
      if (inscription.Text) {
        transcriptionNode = document.createElement("p");
        transcriptionNode.className = "transcription";
        transcriptionNode.setAttribute("lang", inscription.Language === "Greek" ? "grc" : (inscription.Language === "Latin" ? "la" : ""));
        transcriptionNode.textContent = formatTranscription(inscription.Text);
      }
      infoGrid.appendChild(buildInfoBox("Inscription", inscription.Title || null, inscriptionRows, transcriptionNode, true));
    }

    wrap.appendChild(infoGrid);
    return wrap;
  }

  function setExpanded(id, expanded){
    var refs = state.cardRefs[id];
    if (!refs) return;
    refs.article.classList.toggle("is-expanded", expanded);
    refs.toggleBtn.setAttribute("aria-expanded", String(expanded));
    if (typeof refs.panel.inert === "boolean") refs.panel.inert = !expanded;
    if (expanded && !refs.panelBuilt) {
      refs.panelInner.appendChild(buildPanelContent(refs.entry));
      refs.panelBuilt = true;
    }
  }

  // Calls back once the panel's height transition has finished (or immediately,
  // with reduced motion / no transition support), so callers can measure/scroll
  // against the settled layout rather than the mid-animation one.
  function whenPanelSettles(panel, callback){
    if (prefersReducedMotion() || !window.getComputedStyle) {
      callback();
      return;
    }
    var duration = parseFloat(window.getComputedStyle(panel).transitionDuration) || 0;
    if (!duration) {
      callback();
      return;
    }
    var done = false;
    function finish(){
      if (done) return;
      done = true;
      panel.removeEventListener("transitionend", onEnd);
      callback();
    }
    function onEnd(e){
      if (e.target === panel && e.propertyName === "grid-template-rows") finish();
    }
    panel.addEventListener("transitionend", onEnd);
    // Fallback in case transitionend doesn't fire (e.g. the property didn't
    // actually change), so the scroll still happens.
    setTimeout(finish, duration * 1000 + 80);
  }

  function toggleCard(id){
    if (state.expandedId === id) {
      setExpanded(id, false);
      state.expandedId = null;
      return;
    }
    var previous = state.expandedId;
    state.expandedId = id;
    if (previous) setExpanded(previous, false);
    setExpanded(id, true);

    var refs = state.cardRefs[id];
    if (!refs) return;

    // Both the collapsing card (if any) and the expanding card animate on the
    // same duration, so waiting for the expanding one to settle covers both.
    whenPanelSettles(refs.panel, function(){
      if (refs.article.scrollIntoView) {
        refs.article.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "nearest" });
      }
    });
  }

  function createCard(entry){
    var record = entry.record;
    var squeeze = record.Squeeze || {};
    var inscription = record.Inscription || {};
    var object = record.Object || {};

    var title = squeeze.Title || inscription.Title || object.Title || entry.id;
    var location = inscription["Present location"] || squeeze["Present location"] || object["Present location"] || "";
    var language = inscription.Language || "";
    var text = inscription.Text || object.Description || "";
    var imageUrl = state.baseUrl + entry.id + "/thumb.jpg";

    var article = document.createElement("article");
    article.className = "card";

    var panelId = "panel-" + entry.id;

    var toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "card__toggle";
    toggleBtn.setAttribute("aria-expanded", "false");
    toggleBtn.setAttribute("aria-controls", panelId);

    var metaBits = [];
    if (language) metaBits.push(language);
    if (location) metaBits.push(location);
    toggleBtn.setAttribute("aria-label", "Record " + entry.id + ": " + title +
      (metaBits.length ? ", " + metaBits.join(", ") : "") + ". Show details.");

    var media = document.createElement("div");
    media.className = "card__media";
    var img = document.createElement("img");
    img.src = imageUrl;
    img.alt = "Digitized image for record " + entry.id + (title ? ", " + title : "");
    img.loading = "lazy";
    img.addEventListener("error", function(){ media.removeChild(img); });
    media.appendChild(img);

    var idTag = document.createElement("span");
    idTag.className = "card__id";
    idTag.textContent = entry.id;
    media.appendChild(idTag);

    var zoomHint = document.createElement("span");
    zoomHint.className = "card__zoom-hint";
    zoomHint.setAttribute("aria-hidden", "true");
    zoomHint.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path><path d="M11 8v6M8 11h6"></path></svg>';
    media.appendChild(zoomHint);

    var body = document.createElement("div");
    body.className = "card__body";

    var h3 = document.createElement("h3");
    h3.className = "card__title";
    h3.textContent = title;
    body.appendChild(h3);

    if (metaBits.length) {
      var meta = document.createElement("p");
      meta.className = "card__meta";
      if (language) {
        var langSpan = document.createElement("span");
        langSpan.className = "lang";
        langSpan.textContent = language;
        meta.appendChild(langSpan);
      }
      if (location) {
        var locSpan = document.createElement("span");
        locSpan.textContent = location;
        meta.appendChild(locSpan);
      }
      body.appendChild(meta);
    }

    if (text) {
      var p = document.createElement("p");
      p.className = "card__text";
      p.textContent = text.replace(/\s*\/\s*/g, " ").trim();
      body.appendChild(p);
    }

    var cta = document.createElement("span");
    cta.className = "card__cta";
    cta.setAttribute("aria-hidden", "true");
    var ctaLabel = document.createElement("span");
    ctaLabel.textContent = "Record details";
    cta.appendChild(ctaLabel);
    cta.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>');
    body.appendChild(cta);

    toggleBtn.appendChild(media);
    toggleBtn.appendChild(body);

    var panel = document.createElement("div");
    panel.className = "card__panel";
    panel.id = panelId;
    if ("inert" in panel) panel.inert = true;

    var panelInner = document.createElement("div");
    panelInner.className = "card__panel-inner";
    panel.appendChild(panelInner);

    article.appendChild(toggleBtn);
    article.appendChild(panel);

    state.cardRefs[entry.id] = {
      article: article,
      toggleBtn: toggleBtn,
      panel: panel,
      panelInner: panelInner,
      entry: entry,
      title: title,
      mediaImg: img,
      panelBuilt: false
    };

    return article;
  }

  function render(){
    var query = state.query;
    var matches = state.records.filter(function(entry){ return matchesQuery(entry, query); });

    state.expandedId = null;
    state.cardRefs = {};
    els.grid.innerHTML = "";

    if (matches.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = state.records.length
        ? "No records match “" + query + "”. Try a place name, language, or a shorter word."
        : "No records to show.";
      els.grid.appendChild(empty);
    } else {
      var frag = document.createDocumentFragment();
      matches.forEach(function(entry){ frag.appendChild(createCard(entry)); });
      els.grid.appendChild(frag);
    }

    var total = state.records.length;
    if (!query && !state.activeLanguage) {
      els.meta.textContent = "Showing all " + total + " record" + (total === 1 ? "" : "s") + ".";
    } else {
      els.meta.textContent = "Showing " + matches.length + " of " + total + " record" + (total === 1 ? "" : "s") +
        (query ? " for “" + query + "”" : "") +
        (state.activeLanguage ? " in " + state.activeLanguage : "") + ".";
    }
  }

  function buildFilters(){
    if (state.languages.length < 2) return;
    els.filters.hidden = false;
    state.languages.forEach(function(lang){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = lang;
      chip.setAttribute("aria-pressed", "false");
      chip.addEventListener("click", function(){
        var isActive = state.activeLanguage === lang;
        state.activeLanguage = isActive ? null : lang;
        Array.prototype.forEach.call(els.filters.children, function(c){
          c.setAttribute("aria-pressed", String(c === chip && !isActive));
        });
        render();
      });
      els.filters.appendChild(chip);
    });
  }

  function initSearch(){
    els.input.disabled = false;
    els.input.addEventListener("input", function(){
      state.query = els.input.value;
      els.clearBtn.classList.toggle("is-visible", state.query.length > 0);
      render();
    });
    els.form.addEventListener("submit", function(e){ e.preventDefault(); });
    els.clearBtn.addEventListener("click", function(){
      state.query = "";
      els.input.value = "";
      els.clearBtn.classList.remove("is-visible");
      els.input.focus();
      render();
    });
  }

  function cardIdForArticle(article){
    return Object.keys(state.cardRefs).filter(function(key){
      return state.cardRefs[key].article === article;
    })[0];
  }

  var lightboxLastFocused = null;

  function openLightbox(refs){
    if (!els.lightbox || !els.lightboxImg) return;
    lightboxLastFocused = document.activeElement;
    els.lightboxImg.src = refs.mediaImg.src;
    els.lightboxImg.alt = refs.mediaImg.alt;
    els.lightboxCaption.textContent = refs.entry.id + (refs.title ? " — " + refs.title : "");
    els.lightbox.hidden = false;
    document.body.classList.add("lightbox-open");
    els.lightboxClose.focus({ preventScroll: true });
  }

  function closeLightbox(){
    if (!els.lightbox || els.lightbox.hidden) return;
    els.lightbox.hidden = true;
    document.body.classList.remove("lightbox-open");
    els.lightboxImg.src = "";
    if (lightboxLastFocused && typeof lightboxLastFocused.focus === "function") {
      lightboxLastFocused.focus({ preventScroll: true });
    }
    lightboxLastFocused = null;
  }

  function initLightbox(){
    if (!els.lightbox) return;
    els.lightboxClose.addEventListener("click", closeLightbox);
    els.lightbox.addEventListener("click", function(e){
      if (e.target === els.lightbox) closeLightbox();
    });
    window.addEventListener("keydown", function(e){
      if (e.key === "Escape" && !els.lightbox.hidden) closeLightbox();
    });
  }

  function initGrid(){
    els.grid.addEventListener("click", function(e){
      // Clicking the photo itself, only while the card is already expanded,
      // opens the lightbox instead of collapsing the card. Everywhere else
      // on the card keeps toggling expand/collapse exactly as before.
      var img = e.target.closest && e.target.closest(".card__media img");
      if (img) {
        var mediaArticle = img.closest(".card");
        if (mediaArticle && mediaArticle.classList.contains("is-expanded")) {
          var mediaId = cardIdForArticle(mediaArticle);
          if (mediaId) openLightbox(state.cardRefs[mediaId]);
          return;
        }
      }
      var btn = e.target.closest && e.target.closest(".card__toggle");
      if (!btn) return;
      var article = btn.closest(".card");
      if (!article) return;
      var id = cardIdForArticle(article);
      if (id) toggleCard(id);
    });
    els.grid.addEventListener("keydown", function(e){
      if (e.key !== "Escape" || !state.expandedId) return;
      var id = state.expandedId;
      toggleCard(id);
      var refs = state.cardRefs[id];
      if (refs && refs.toggleBtn) refs.toggleBtn.focus();
    });
  }

  function showError(message, detail){
    els.title.textContent = "Couldn’t load the collection";
    els.lede.textContent = message;
    els.eyebrow.textContent = "Digital Epigraphy and Archaeology Project";
    var err = document.createElement("div");
    err.className = "error";
    var p = document.createElement("p");
    p.textContent = "This page reads index.json with fetch(), which most browsers block for files opened directly from disk.";
    err.appendChild(p);
    if (detail) {
      var code = document.createElement("code");
      code.textContent = detail;
      err.appendChild(code);
    }
    var p2 = document.createElement("p");
    p2.style.marginTop = ".75rem";
    p2.textContent = "Serve this folder over HTTP instead, e.g. run “python3 -m http.server” in it and open the printed localhost address, or host it (as on GitHub Pages) alongside index.json.";
    err.appendChild(p2);
    els.grid.innerHTML = "";
    els.grid.appendChild(err);
    els.meta.textContent = "";
  }

  function init(json){
    state.data = json;
    state.baseUrl = json.URL || "";
    state.folder = guessFolderName(state.baseUrl);
    state.editorsDict = json.Editors || {};
    state.sourcesDict = json.Sources || {};

    var index = buildSearchIndex(json);
    state.records = index.records;
    state.languages = index.languages;

    var collectionName = json.Collection || "Squeeze Collection";
    els.title.textContent = collectionName;
    document.title = collectionName + " — Search";
    els.lede.textContent = "Search " + state.records.length + " digitized fragments by place, language, editor, or transcribed text.";
    if (els.metaDescription) {
      els.metaDescription.setAttribute("content", "Search and browse " + collectionName + ", a digitized epigraphic squeeze collection of " + state.records.length + " records.");
    }
    els.footerCredit.textContent = collectionName + " · " + state.records.length +
      " records · click a record for details, with a link through to the 3D viewer.";

    buildFilters();
    initSearch();
    initGrid();
    initLightbox();
    render();
    els.input.focus({ preventScroll: true });
  }

  fetch("index.json", { cache: "no-cache" })
    .then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(init)
    .catch(function(err){
      showError("Couldn’t fetch index.json.", String(err && err.message ? err.message : err));
    });
})();
</script>
</body>
</html>
